@media(min-width:601px){.tools{grid-template-columns:repeat(4,auto);justify-content:start}.tools button,.tools .cbt{flex-direction:row;gap:8px;min-height:48px;padding:10px 18px;font-size:17px}.pub{width:auto;min-width:220px}}

/* «Я в порядке» */
.ckn{display:flex;gap:12px;align-items:center}.ckn .gx{min-width:0}.ckn button{flex:none}
.cks{display:none;font-size:14px;line-height:1.35}

/* планшеты и телефоны */
@media(max-width:900px){
:root{--nh:66px}
body{padding-bottom:calc(var(--nh) + env(safe-area-inset-bottom,0px) + 32px)}
.hb{min-height:var(--hh);padding:7px 12px;gap:8px}
.logo{font-size:17px;gap:9px;letter-spacing:.03em;min-width:0;overflow:hidden;white-space:nowrap}
.logo svg{width:38px!important;height:auto;flex:none}
.wxc{min-height:44px}
.me{display:flex;min-width:44px;min-height:44px;align-items:center;justify-content:center;border-radius:22px}
.w{grid-template-columns:minmax(0,680px);justify-content:center;margin-top:8px;padding:0 12px}
main{min-width:0}
nav{grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(15,40,28,.07)}
nav a{min-height:56px;gap:3px;padding:4px 0;border-radius:14px;color:var(--mu);font-size:12.5px;font-weight:600;line-height:1.1;box-shadow:none;-webkit-user-select:none;user-select:none}
nav a .i{box-sizing:border-box;width:58px;height:32px;padding:4px 17px;border-radius:16px;transition:background-color .2s}
nav a:hover{background:none;text-decoration:none}
nav a.on{background:none;box-shadow:none;color:var(--pr);font-weight:700}
nav a.on .i,nav a:active .i{background:var(--pt)}
.land{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;align-items:center;margin:14px auto 28px;max-width:600px}
.land.one{display:block;max-width:560px}
.land:not(.one)>div:first-child{display:contents}
.land .hero{grid-column:1;grid-row:1;height:62px;margin:0;border-radius:10px;box-shadow:none}
.land h1{grid-column:2;grid-row:1;font-size:23px;line-height:1.15;margin:0}
.land .lead{grid-column:1/-1;grid-row:2;font-size:17px;margin:0}
.land>.c:last-child{grid-column:1/-1;grid-row:3;margin:0}
.land .ben{grid-column:1/-1;grid-row:4;margin:6px 0 0;gap:14px}
.land .ben .i{width:44px;height:44px;padding:11px}
.land:not(.one)>.c:not(:last-child){grid-column:1/-1;grid-row:5;margin:0}
.r>a:not(.nmx):not(:has(.av)){padding:10px 8px}
#pl p a{display:inline-block;padding:10px 0}
}

/* телефоны */
@media(max-width:640px){
.hx{display:none}
.me b{display:none}
}
@media(max-width:600px){
.w{padding:0;margin-top:0}
main{padding-top:8px}
.w .c{border-radius:0;border-width:1px 0;margin-bottom:8px;padding:16px;box-shadow:none}
.w .c.cpo,.w .c.cpd{border-left-width:5px}
.w .c.prof{padding:0}
h1{font-size:28px}
#posts>.seg{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:15;margin:0 0 8px;padding:8px 12px;gap:6px;background:var(--cd);border:0;border-bottom:1px solid var(--br);border-radius:0}
.seg a{display:flex;align-items:center;justify-content:center;min-height:46px;padding:6px 4px;border-radius:12px;font-size:16px}
.seg a.on{background:var(--pt);color:var(--pr);box-shadow:none}
.gal{margin:12px -16px;border-radius:0}
.gal.o img{max-height:70vh;max-height:70dvh}
.vp,.vv{width:calc(100% + 32px);margin:12px -16px;border-radius:0;max-height:70dvh}
.w .ac{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.w .ac>button{min-width:0;min-height:48px;padding:8px 10px;font-size:16px;line-height:1.2;text-align:center}
.w .ac>button:nth-last-child(2):nth-child(odd){grid-column:1/-1}
.w .ac>button:nth-child(n+3) .i{display:none}
.w .ac .sg{grid-column:1/-1;margin:0;justify-content:center;min-height:40px}
.pl{width:100%}
.pv{gap:10px}.th img{width:72px;height:72px}.th .x{top:-10px;right:-10px;width:40px;min-height:40px}
.ckl{display:none}.cks{display:block}.ckn button{padding:10px 14px;gap:6px}
.ban{height:112px}
.pf{padding:0 16px 14px;gap:10px}
.pa{order:1;margin-top:-42px}
.pf>button{order:2;margin-left:auto}
.pi{order:3;flex:1 1 100%;min-width:0;padding-top:0}
.prof .k{margin:0 16px 16px}
.ag{grid-template-columns:1fr}
.fl-l{display:none}.fl-s{display:inline}
.r{gap:10px}.r button{padding:8px 14px;min-height:46px}
.wt b{font-size:20px}
.obm .ac{display:grid;grid-template-columns:1fr 1fr;gap:8px}.obm .ac button{padding:8px 10px;min-width:0}
main[data-v=feed] #posts>article{scroll-margin-top:calc(var(--hh) + env(safe-area-inset-top,0px) + 72px)}
.wg{grid-template-columns:repeat(2,minmax(0,1fr))}
.wd{display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:12px;align-items:center}
.wd>.mu{grid-column:2/-1;font-size:14px}
.cw button{padding:10px 14px}
#mo{align-items:flex-end;padding:0;overscroll-behavior:contain}
.mb{width:100%;border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh;overflow:auto;animation:sheet .22s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.mb::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--br);margin:10px auto 8px}
.wmb{padding:0 18px 20px}
#mv{height:min(56vh,420px);height:min(56dvh,420px)}
#pmap{height:min(300px,46vh);height:min(300px,46dvh)}
#ob{align-items:flex-end;padding:0}
.obc{width:100%;border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh;animation:sheet .22s ease-out}
.obh{height:72px;border-radius:20px 20px 0 0}
.obb{padding:18px 18px 8px}
.obf{position:sticky;bottom:0;background:var(--cd);border-top:1px solid var(--br);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));gap:8px}
.obf button.g{padding:10px 12px;box-shadow:none;background:transparent}
}
@media(max-width:340px){
.logo{font-size:15px;gap:8px}.logo svg{width:32px!important}.wxc .i{display:none}
nav a{font-size:11.5px}
.tools button,.tools .cbt{font-size:13px}
}
@media(max-height:480px) and (orientation:landscape) and (max-width:900px){
:root{--hh:48px;--nh:48px}
.hb{min-height:var(--hh);padding-top:2px;padding-bottom:2px}
nav a{flex-direction:row;min-height:44px;gap:6px}
nav a .i{width:44px;height:30px;padding:3px 10px}
}
